<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#07111b" />
  <title>Zombie Bone Hunter</title>
  <script type="module" crossorigin src="./assets/index-CEEDOZiv.js"></script>

  <!-- Ficheiros de Melhorias e Comunicação Android inseridos via módulos JS -->
  <script type="module" src="./js_fixes/AndroidBridge.js"></script>
  <script type="module" src="./js_fixes/ObjectPool.js"></script>
  <script type="module" src="./js_fixes/CameraEffects.js"></script>
  <script type="module" src="./js_fixes/ZombieSoundManager.js"></script>
  <script>
    // Garantir que o som está no máximo (100%) no localStorage e desbloquear o AudioContext
    try {
        let savedData = localStorage.getItem('neon_deadlands_3d_meta');
        let parsed = savedData ? JSON.parse(savedData) : {};
        if (!parsed) parsed = {};
        parsed.masterMuted = false;
        parsed.musicMuted = false;
        parsed.masterVolume = 100;
        parsed.musicVolume = 100;
        localStorage.setItem('neon_deadlands_3d_meta', JSON.stringify(parsed));
    } catch (e) {
        console.error("Erro ao ajustar volumes no localStorage:", e);
    }

    // Desbloqueio Global de Áudio para navegadores e WebView Android
    const unlockAudio = () => {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
            const ctx = new AudioContext();
            if (ctx.state === 'suspended') ctx.resume();
        }
        if (window.ZombieEngine && window.ZombieEngine.updateAudioVolumes) {
            window.ZombieEngine.updateAudioVolumes();
        }
    };

    ['click', 'touchstart', 'pointerdown', 'keydown', 'mousedown'].forEach(evt => {
        window.addEventListener(evt, unlockAudio, { once: false, passive: true });
    });

    // Inicialização da ponte Android quando a janela carregar
    window.addEventListener('load', () => {
        import('./js_fixes/AndroidBridge.js').then(module => {
            module.initAndroidBridge(
                { addBones: function(b) { console.log('Adicionado ' + b + ' ossos'); } },
                function pause() { console.log('PAUSADO'); },
                function resume() { console.log('RETOMADO'); }
            );
        }).catch(err => console.error('Erro ao carregar AndroidBridge:', err));
    });
  </script>
  <link rel="stylesheet" crossorigin href="./assets/index-CL7n8_Sh.css">
  <link rel="stylesheet" href="./js_fixes/UIFixes.css">
</head>
<body>
  <!-- Precarregamento da Textura da Relva -->
  <img id="zbhGrassTextureImg" src="./grass_texture.png" alt="grass" style="display:none;" />
  <div id="root"></div>
</body>
</html>
